<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><style>  :root{
    --paper:#F2EDDF; --ink:#22201A; --clay:#C96442; --faint:#8A8574;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  body{
    background:var(--paper);
    font-family:"Noto Sans TC",sans-serif; color:var(--ink); position:relative;
    background-image:radial-gradient(rgba(34,32,26,.05) 1px, transparent 1px);
    background-size:26px 26px;
  }
  .frame{position:absolute; inset:36px; border:3px solid var(--ink); border-radius:34px;}
  .frame::after{content:""; position:absolute; inset:-11px; border:1.5px solid var(--ink); border-radius:42px; opacity:.35;}
  .inner{position:absolute; inset:36px; padding:56px 72px 52px; display:flex; flex-direction:column;}
  .top{display:flex; justify-content:space-between; align-items:center}
  .series{font-size:26px; font-weight:700; letter-spacing:.06em}
  .day{
    font-family:"JetBrains Mono",monospace; font-size:26px; font-weight:700;
    color:var(--paper); background:var(--clay); padding:8px 22px; border-radius:999px;
    border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink);
  }
  .cardtitle{text-align:center; margin-top:52px}
  .cardtitle h1{font-size:76px; font-weight:900; letter-spacing:.02em}
  .cardtitle .under{display:block; width:180px; height:10px; background:var(--clay); border-radius:5px; margin:18px auto 0}
  .cardtitle p{font-size:32px; color:var(--faint); margin-top:20px; font-weight:500}
  .mid{flex:1; display:flex; flex-direction:column; justify-content:center}
  .foot{display:flex; justify-content:space-between; align-items:center; font-size:24px; color:var(--faint); letter-spacing:.08em}
  .foot .page{font-family:"JetBrains Mono",monospace; font-weight:700; color:var(--ink)}
  .mono{font-family:"JetBrains Mono",monospace}

.inner{padding:64px 72px 56px}.series{font-size:30px}.series small{display:block;font-size:20px;font-weight:500;color:var(--faint);letter-spacing:.18em;margin-top:6px}
.day{font-size:30px;padding:10px 26px;box-shadow:6px 6px 0 var(--ink)}.mid{gap:36px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:30px;color:var(--faint)}.eyebrow b{color:var(--clay);font-weight:700}
h1{font-size:112px;font-weight:900;line-height:1.28;letter-spacing:.01em}
h1 .hl{background:var(--ink);color:var(--paper);display:inline-block;padding:0 22px 10px;border-radius:14px;margin-top:18px}
.sub{font-size:40px;font-weight:500;line-height:1.6}.sub b{font-weight:900;border-bottom:8px solid var(--clay)}
.term{background:var(--ink);color:var(--paper);border-radius:20px;padding:30px 36px;font-family:"JetBrains Mono",monospace;font-size:26px;line-height:1.5;white-space:nowrap;box-shadow:8px 8px 0 rgba(34,32,26,.18)}
.term .p{color:var(--clay);font-weight:700}.foot{margin-top:36px;font-size:26px}.foot .swipe{font-weight:700;color:var(--ink)}</style></head><body><div class="frame"></div><div class="inner"><div class="top"><div class="series">每天讓 Claude Code 變強一點<small>CLAUDE CODE 字典</small></div><div class="day">Day 40</div></div><div class="mid"><div class="eyebrow">環境變數 <b>ANTHROPIC_DEFAULT_MODEL</b></div>
<h1>開起來就是<br><span class="hl">你要的模型</span></h1>
<div class="sub">2.1.236 新增,設一次就好<br>新視窗都從<b>這個模型</b>起跑</div></div>
<div class="term"><span class="p">&gt;</span> ANTHROPIC_DEFAULT_MODEL=opus</div><div class="foot"><span>@yrrah9_</span><span class="swipe">怎麼用 → 往左滑</span></div></div></body></html>
